name: CI

on:
  push:
    # Feature branches are covered by the wildcards, so a branch is green (or
    # not) before it is merged into dev.
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the previous, still-running check.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  # CI never touches real secrets: the key only has to exist for settings to load.
  SECRET_KEY: ci-secret-key-not-used-outside-github-actions

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check --output-format=github .

  test-sqlite:
    name: Tests (SQLite / DJANGO_ENV=local)
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: local
      DEBUG: 'False'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        working-directory: backend
        run: python manage.py check

      - name: Fail if a model change has no migration
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: backend
        run: python manage.py test --verbosity=2

  flutter:
    name: Flutter (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [shared_client, merchant_app, customer_app]
    defaults:
      run:
        working-directory: apps/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

  test-postgres:
    name: Tests (PostgreSQL / DJANGO_ENV=production)
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: production
      DEBUG: 'False'
      DB_NAME: sylibooking_test
      DB_USER: sylibooking
      DB_PASSWORD: sylibooking
      DB_HOST: localhost
      DB_PORT: '5432'
      # Points the queue at the service below, so the one test that needs a
      # real broker runs here rather than skipping everywhere.
      CELERY_BROKER_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sylibooking_test
          POSTGRES_USER: sylibooking
          POSTGRES_PASSWORD: sylibooking
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # A real broker on one job, so the queue is exercised against Redis
      # rather than only in the eager mode the rest of the suite uses.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        working-directory: backend
        run: python manage.py check

      - name: Verify migrations apply cleanly to a fresh database
        working-directory: backend
        run: python manage.py migrate

      - name: Run tests
        working-directory: backend
        run: python manage.py test --verbosity=2
  # The deployment path, checked on every push rather than on the day it is
  # first used. A Dockerfile that has never been built is a guess.
  deploy-checks:
    name: Deployability (image + production settings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Django's own deployment checklist, run against production settings.
      # It is the difference between finding out about a missing HSTS header
      # here and finding out from somebody else's scanner.
      - name: Django deployment checks
        working-directory: backend
        env:
          DJANGO_ENV: production
          DEBUG: 'False'
          SECRET_KEY: ci-only-long-enough-to-satisfy-the-check-0123456789
          ALLOWED_HOSTS: example.invalid
          DB_NAME: sylibooking
          DB_USER: sylibooking
          DB_PASSWORD: sylibooking
          DB_HOST: localhost
        run: python manage.py check --deploy --fail-level WARNING

      - name: Build the image
        run: docker build -t sylibooking-backend:ci .

      # It has to start, migrate and answer — a build that succeeds and a
      # container that cannot boot are different things.
      - name: The image boots and answers its health check
        run: |
          # Booted as local on purpose. This step asks whether the image
          # starts, migrates and answers; production settings would drag
          # in a database and a TLS terminator that prove nothing about
          # the image itself. The step above is what checks those.
          docker run -d --name api \
            -e DEBUG=False \
            -e SECRET_KEY=ci-only-long-enough-to-satisfy-the-check-0123456789 \
            -e ALLOWED_HOSTS='*' \
            -e DJANGO_ENV=local \
            -p 8000:8000 \
            sylibooking-backend:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health/ > /dev/null; then
              echo "up"
              curl -s http://localhost:8000/api/health/
              docker rm -f api
              exit 0
            fi
            sleep 2
          done
          echo "never came up:"
          docker logs api
          exit 1
