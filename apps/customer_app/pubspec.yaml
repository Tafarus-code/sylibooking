name: customer_app
description: "Sylibooking customer app — find a lounge or restaurant and reserve a table."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  shared_client:
    path: ../shared_client
  image_picker: ^1.2.3
  geolocator: ^14.0.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Widget tests stub the network with http's MockClient.
  http: ^1.2.2

flutter:
  uses-material-design: true
  # ARB files live in lib/l10n; see l10n.yaml for the rest.
  generate: true
