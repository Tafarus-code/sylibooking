[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort — import ordering
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
]

[tool.ruff.lint.per-file-ignores]
# Django generates the AUTH_PASSWORD_VALIDATORS paths over the line limit.
"backend/config/settings.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "establishments", "payments", "reservations"]

[tool.ruff.format]
quote-style = "single"